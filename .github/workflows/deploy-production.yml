name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, preview]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t board:prod .

      - name: Load image into kind cluster
        run: kind load docker-image board:prod --name kind

      - name: Deploy to prod
        run: |
          kubectl set image deployment/board \
            board=board:prod \
            -n board-prod
          kubectl rollout status deployment/board -n board-prod --timeout=180s
