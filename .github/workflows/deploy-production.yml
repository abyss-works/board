name: Deploy Production

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t board:prod .

      - name: Load image into kind cluster
        run: kind load docker-image board:prod --name kind

      - name: Update manifest with new image tag
        run: |
          kustomize edit set image board=board:prod k8s/

      - name: Commit and push manifest change
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: bump board image to prod"
          git push

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, prod]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build versioned Docker image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker build -t board:$VERSION .
          kind load docker-image board:$VERSION --name kind

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
