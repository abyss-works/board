apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: board-prod
  namespace: argocd
spec:
  destination:
    namespace: board-prod
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s/prod
    repoURL: https://github.com/abyss-works/board
    targetRevision: feat/argocd-13
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
