apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-board
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-board
  template:
    metadata:
      labels:
        app: community-board
    spec:
      containers:
      - name: community-board
        image: community-board:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: DB_NAME
          value: community
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: community-board
  namespace: prod
spec:
  selector:
    app: community-board
  ports:
  - port: 80
    targetPort: 8080
