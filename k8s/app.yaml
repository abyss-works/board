apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: board-prod
  labels:
    app: board
    project: board
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
        project: board
        environment: prod
    spec:
      containers:
      - name: board
        image: board:prod
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: DB_NAME
          value: community
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: board-prod
  labels:
    app: board
    project: board
    environment: prod
spec:
  selector:
    app: board
  ports:
  - port: 80
    targetPort: 8080
